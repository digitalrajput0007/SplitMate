<style>
        body { background-color: #f9f9f9; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Checkbox styling */
        .custom-checkbox {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid #757684; /* outline color */
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            position: relative;
            background-color: transparent;
            transition: all 0.2s ease-in-out;
        }

        .custom-checkbox:checked {
            background-color: #24389c; /* primary color */
            border-color: #24389c;
        }

        .custom-checkbox:checked::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 7px;
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
    </style>

<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-container-margin h-16 bg-surface dark:bg-background transition-colors duration-200 flat no shadows docked full-width top-0">

</div>

</label>
