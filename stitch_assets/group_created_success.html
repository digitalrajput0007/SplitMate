<div class="mb-xl flex items-center justify-center w-[120px] h-[120px] rounded-full bg-primary-fixed shadow-[0_4px_20px_0_rgba(0,0,0,0.04)] animate-[popIn_0.5s_ease-out_forwards]">
<span class="material-symbols-outlined text-[64px] text-primary" style="font-variation-settings: 'FILL' 1, 'wght' 400;">

            </span>
</div>
<!-- Typography Stack -->
<div class="text-center space-y-sm mb-xxl w-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Group created!</h1>
<h2 class="font-title-md text-title-md text-on-surface mt-sm">Goa Trip is ready. What's next?</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Add the first expense to get started</p>
</div>
<!-- Action Stack -->
<div class="w-full flex flex-col gap-md">

<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'wght' 600;">add</span>

            </button>
<!-- Secondary Action -->
<button class="w-full flex items-center justify-center gap-sm bg-transparent border border-primary text-primary font-label-md text-label-md py-md px-lg rounded-lg hover:bg-surface-container-low active:bg-surface-container transition-colors duration-200">
<span class="material-symbols-outlined text-[20px]">person_add</span>
                Invite more people
            </button>
<!-- Tertiary Action -->
<button class="w-full mt-sm text-primary font-label-md text-label-md py-sm px-lg rounded-lg hover:underline underline-offset-4 decoration-primary/50 transition-all duration-200 opacity-80 hover:opacity-100">
                Skip for now
            </button>

        @keyframes popIn {
