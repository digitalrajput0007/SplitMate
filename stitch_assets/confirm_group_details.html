<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex items-center px-container-margin h-16 bg-surface dark:bg-background text-primary dark:text-inverse-primary font-title-md text-title-md docked full-width top-0 flat no shadows justify-between">
<div class="flex items-center hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors duration-200 active:opacity-70 p-2 rounded-full cursor-pointer">

</div>
<div class="flex-grow text-center font-title-md text-title-md">Confirm Group Details</div>

<div class="w-full max-w-sm bg-surface-container-lowest rounded-xl p-md shadow-[0_4px_20px_0_rgba(0,0,0,0.04)] flex flex-col gap-lg border border-[#F2F2F7]">
<!-- Header Section -->
<div class="flex flex-col gap-xs text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Confirm Group Details</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please review the details below before creating the group.</p>
</div>
<div class="w-full h-px bg-surface-variant"></div>
<!-- Row 1: Name -->
<div class="flex justify-between items-center">
<div class="flex flex-col gap-xs">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Group Name</span>
<span class="font-title-md text-title-md text-on-surface">Goa Trip</span>
</div>
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container fill" data-icon="check_circle" data-weight="fill">check_circle</span>
</div>
</div>
<!-- Row 2: Type & Date -->
<div class="flex gap-md">
<div class="flex flex-col gap-xs flex-1">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Type</span>
<div class="h-8 rounded-full bg-surface-container-high flex items-center justify-center px-sm w-fit">
<span class="font-label-md text-label-md text-on-surface">TRIP</span>
</div>
</div>
<div class="flex flex-col gap-xs flex-1">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Dates</span>
<div class="h-8 rounded-full bg-surface-container-high flex items-center justify-center px-sm w-fit">
<span class="font-label-md text-label-md text-on-surface">Aug 10 - Aug 15</span>
</div>
</div>
</div>
<!-- Row 3: Members -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-end">
<span class="font-label-md text-label-md text-on-surface-variant uppercase">Members</span>
<span class="font-label-md text-label-md text-primary">3 Members</span>
</div>
<div class="flex gap-2">
<div class="w-10 h-10 rounded-full bg-tertiary-fixed text-on-tertiary-fixed flex items-center justify-center font-title-md text-title-md">A</div>
<div class="w-10 h-10 rounded-full bg-primary-fixed text-on-primary-fixed flex items-center justify-center font-title-md text-title-md">P</div>
<div class="w-10 h-10 rounded-full bg-secondary-fixed text-on-secondary-fixed flex items-center justify-center font-title-md text-title-md">N</div>
</div>
</div>
</div>

<div class="w-full max-w-sm mt-xl flex gap-md">
<button class="flex-1 h-12 rounded-lg border border-primary text-primary font-title-md text-title-md flex items-center justify-center transition-opacity hover:opacity-80 active:opacity-60 bg-transparent">
